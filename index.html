<style>

<script>
firebase.initializeApp({

// 入力した名前はこの端末内だけに保存し、次回の候補として表示する。
const REMEMBERED_NAMES_KEY = "reservationRememberedNames";
const MAX_REMEMBERED_NAMES = 20;

function getRememberedNames(){
  try{
    const names = JSON.parse(localStorage.getItem(REMEMBERED_NAMES_KEY) || "[]");
    return Array.isArray(names) ? names.filter(name => typeof name === "string" && name.trim()) : [];
  }catch(_){
    return [];
  }
}

function rememberName(name){
  const trimmed = name.trim();
  if(!trimmed) return;

  const names = getRememberedNames().filter(saved => saved !== trimmed);
  names.unshift(trimmed);
  try{
    localStorage.setItem(REMEMBERED_NAMES_KEY, JSON.stringify(names.slice(0, MAX_REMEMBERED_NAMES)));
  }catch(_){}
}

function refreshRememberedNameSelect(){
  const area = document.getElementById("rememberedNameArea");
  const select = document.getElementById("rememberedNameSelect");
  const names = getRememberedNames();

  select.replaceChildren(new Option("選んでください", ""));
  names.forEach(name => select.add(new Option(name, name)));
  area.style.display = names.length ? "block" : "none";
}

function askReservationName(currentName = ""){
  const backdrop = document.getElementById("nameDialogBackdrop");
  const form = document.getElementById("nameDialog");
  const input = document.getElementById("reservationNameInput");
  const select = document.getElementById("rememberedNameSelect");
  const cancel = document.getElementById("cancelNameDialog");
  const clear = document.getElementById("clearRememberedNames");

  refreshRememberedNameSelect();
  input.value = currentName || "";
  select.value = "";
  backdrop.classList.add("open");
  document.body.style.overflow = "hidden";
  setTimeout(()=> input.focus(), 0);

  return new Promise(resolve => {
    const finish = value => {
      backdrop.classList.remove("open");
      document.body.style.overflow = "";
      form.onsubmit = null;
      cancel.onclick = null;
      clear.onclick = null;
      select.onchange = null;
      backdrop.onkeydown = null;
      resolve(value);
    };

    select.onchange = () => {
      if(select.value) input.value = select.value;
      input.focus();
    };
    clear.onclick = () => {
      localStorage.removeItem(REMEMBERED_NAMES_KEY);
      refreshRememberedNameSelect();
      input.focus();
    };
    cancel.onclick = () => finish(null);
    backdrop.onkeydown = event => {
      if(event.key === "Escape") finish(null);
    };
    form.onsubmit = event => {
      event.preventDefault();
      finish(input.value);
    };
  });
}

function isIPhone(){
  const ua = navigator.userAgent || "";
  return /iPhone/i.test(ua);
}
function isAndroid(){
  const ua = navigator.userAgent || "";
  return /Android/i.test(ua);
}
// ===== 状態 =====
let viewerAudio  = null;
let currentDocId = null;
let currentRow   = null;
let currentBtn   = null;
let userStopped  = false;
let seekTimer    = null;


// PDF/実ページを開いている間は停止抑止
let suppressStopForPdf = false;
let pdfModalOpen = false;
let currentPdfModalUrl = null;

function isMobileLike(){
  const ua = navigator.userAgent || "";
  return /iPhone|Android/i.test(ua);
}

function shouldSuppressStop(){
  return suppressStopForPdf || pdfModalOpen;
}

function setPlayButtonState(btn, id, isPlaying){
  if(!btn) return;
  btn.textContent = isPlaying ? "⏸" : "▶";
  btn.title = isPlaying ? "音声を一時停止" : "音声を再生";
  btn.setAttribute("aria-label", `音声 ${id} を${isPlaying ? "一時停止" : "再生"}`);
}

// ===== 停止 =====
function stopAudio(intentional = true){
  userStopped = intentional;
  clearInterval(seekTimer);
  seekTimer = null;

  if(viewerAudio){
    viewerAudio.onplay  = null;
    viewerAudio.onpause = null;
    viewerAudio.onended = null;
    viewerAudio.onerror = null;
    viewerAudio.pause();
    viewerAudio.currentTime = 0;
    viewerAudio = null;
  }

  document.querySelectorAll(".row.playing").forEach(r=>{
    r.classList.remove("playing");
    const sb = r.querySelector(".seekbar");
    if(sb){
      sb.value = 0;
      updateSeekbarFill(sb, 0);
    }
    const cur = r.querySelector(".seek-cur");
    const dur = r.querySelector(".seek-dur");
    if(cur) cur.textContent = "0:00";
    if(dur) dur.textContent = "0:00";
  });

  setPlayButtonState(currentBtn, currentDocId, false);
  currentBtn = null;
  currentRow = null;
  currentDocId = null;
}

function stopIfSafe(){
  if(shouldSuppressStop()) return;
  stopAudio(true);
}

function keepAudioPlaying(){
  if(!viewerAudio || userStopped) return;
  if(viewerAudio.paused){
    viewerAudio.play().catch(()=>{});
  }
}

function loadPdfModalFrame(){
  if(!currentPdfModalUrl) return;
  const frame = document.getElementById("pdfFrame");
  const reloadUrl = new URL(currentPdfModalUrl, window.location.href);
  reloadUrl.searchParams.set("_reload", Date.now());

  frame.src = "about:blank";
  requestAnimationFrame(()=> {
    frame.src = reloadUrl.href;
  });
}

function togglePdfModalSize(){
  const panel = document.getElementById("pdfModalPanel");
  const button = document.getElementById("expandPdfModal");
  const isExpanded = panel.classList.toggle("expanded");
  button.textContent = isExpanded ? "元の大きさ" : "画面拡大";
}

function openPdfModal(url, title="文章表示"){
  const modal = document.getElementById("pdfModal");
  const frame = document.getElementById("pdfFrame");
  const ttl   = document.getElementById("pdfModalTitle");

  ttl.textContent = title;
  suppressStopForPdf = true;
  pdfModalOpen = true;
  currentPdfModalUrl = toAbsoluteUrl(url);
  modal.style.display = "block";
  loadPdfModalFrame();
  keepAudioPlaying();
}

function toAbsoluteUrl(url){
  return new URL(url, window.location.href).href;
}

function openInNewTabOrCurrent(url){
  const opened = window.open(url, "_blank");
  if(!opened) window.location.href = url;
}

function openPdfForDevice(url, title){
  if(isIPhone()){
    openPdfModal(url, title);
    return;
  }

  if(isAndroid()){
    openPdfModal(url, title);
    return;
  }

  openInNewTabOrCurrent(url);
  setTimeout(()=>{ suppressStopForPdf = false; }, 5000);
}

function closePdfModal(){
  const modal = document.getElementById("pdfModal");
  const panel = document.getElementById("pdfModalPanel");
  const frame = document.getElementById("pdfFrame");
  modal.style.display = "none";
  frame.src = "";
  pdfModalOpen = false;
  currentPdfModalUrl = null;
  panel.classList.remove("expanded");
  document.getElementById("expandPdfModal").textContent = "画面拡大";
  suppressStopForPdf = false;
  keepAudioPlaying();
}

window.addEventListener("DOMContentLoaded", ()=>{
  const closeBtn = document.getElementById("closePdfModal");
  const reloadBtn = document.getElementById("reloadPdfModal");
  const expandBtn = document.getElementById("expandPdfModal");
  if(closeBtn){
    closeBtn.onclick = closePdfModal;
  }
  if(reloadBtn){
    reloadBtn.onclick = loadPdfModalFrame;
  }
  if(expandBtn){
    expandBtn.onclick = togglePdfModalSize;
  }
});

// ===== 画面離脱 =====
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden"){
    // 文書モーダルの表示中は、AndroidのPDF表示による一時的な画面離脱を無視する
    if(isMobileLike() && !shouldSuppressStop()){
      stopAudio(true);
    }
  }
});

// pageshow: Android別タブから戻ったとき visibilitychange が来ない場合の保険
window.addEventListener("pageshow", ()=>{
  if(!pdfModalOpen) suppressStopForPdf = false;
  if(pdfModalOpen) keepAudioPlaying();
});

window.addEventListener("focus", ()=>{
  if(!pdfModalOpen) suppressStopForPdf = false;
  if(pdfModalOpen) keepAudioPlaying();
});

window.addEventListener("blur", ()=>{
  if(pdfModalOpen) keepAudioPlaying();
});

document.addEventListener("fullscreenchange", keepAudioPlaying);
document.addEventListener("webkitfullscreenchange", keepAudioPlaying);

window.addEventListener("pagehide", ()=>{
  // 文書モーダルの表示中は音声を維持する
  if(isMobileLike() && !shouldSuppressStop()){
    stopAudio(true);
  }
});

window.addEventListener("beforeunload", ()=>{
  // ページを本当に離れる時は止める
  stopAudio(true);
});

// ===== シークバー補助 =====
function fmt(sec){
  if(!isFinite(sec)) return "0:00";
  const m = Math.floor(sec/60);
  const s = String(Math.floor(sec%60)).padStart(2,"0");
  return `${m}:${s}`;
}
function updateSeekbarFill(sb, pct){
  sb.style.background =
    `linear-gradient(to right,#f59e0b ${pct}%,#e5e7eb ${pct}%)`;
}
// ===== 古いiPhone対策つき音声再生 =====
async function tryPlay(src){
  const a = new Audio();
  a.preload = "auto";
  a.src = src;
  a.playsInline = true;
  a.setAttribute("playsinline", "");
  a.setAttribute("webkit-playsinline", "");
  a.load();
  await a.play();
  return a;
}

async function loadAndPlayAudio(id, row, btn, seekWrap){
  let audio = null;

  // 古いiPhone対策で mp3 を最優先
  try{
    audio = await tryPlay(`audio/${id}.mp3`);
  }catch(_){}

  if(!audio){
    try{
      audio = await tryPlay(`audio/${id}.m4a`);
    }catch(_){}
  }

  if(!audio){
    try{
      audio = await tryPlay(`audio/${id}.aac`);
    }catch(_){}
  }

  if(!audio){
    alert("音声を再生できませんでした。iPhoneの消音モード解除、音量確認、再読み込みをお試しください。");
    throw new Error("音声なし");
  }

  viewerAudio = audio;
  userStopped = false;

  const sb  = seekWrap.querySelector(".seekbar");
  const cur = seekWrap.querySelector(".seek-cur");
  const dur = seekWrap.querySelector(".seek-dur");

  // 前回のリスナーを一括解除してから再登録
  if(seekWrap._sbAbort) seekWrap._sbAbort.abort();
  const sbAc = new AbortController();
  seekWrap._sbAbort = sbAc;
  const sig = { signal: sbAc.signal };

  const initSeek = ()=>{
    if(isFinite(audio.duration)){
      sb.max = audio.duration;
      dur.textContent = fmt(audio.duration);
    }
  };
  audio.addEventListener("loadedmetadata", initSeek);
  initSeek();

  let dragging = false;
  sb.addEventListener("mousedown",  ()=>{ dragging = true;  }, sig);
  sb.addEventListener("touchstart", ()=>{ dragging = true;  }, { passive:true, signal: sbAc.signal });
  sb.addEventListener("mouseup",    ()=>{ dragging = false; }, sig);
  sb.addEventListener("touchend",   ()=>{ dragging = false; }, sig);

  sb.addEventListener("input", ()=>{
    const pct = sb.max > 0 ? (sb.value / sb.max) * 100 : 0;
    updateSeekbarFill(sb, pct);
    cur.textContent = fmt(Number(sb.value));
  }, sig);

  sb.addEventListener("change", ()=>{
    if(viewerAudio === audio){
      audio.currentTime = Number(sb.value);
    }
  }, sig);

  clearInterval(seekTimer);
  seekTimer = setInterval(()=>{
    if(!dragging && viewerAudio === audio && isFinite(audio.duration)){
      sb.value = audio.currentTime;
      const pct = (audio.currentTime / audio.duration) * 100;
      updateSeekbarFill(sb, pct);
      cur.textContent = fmt(audio.currentTime);
      dur.textContent = fmt(audio.duration);
    }
  }, 200);

  setPlayButtonState(btn, id, true);

  audio.onplay = ()=>{
    if(viewerAudio !== audio) return;
    setPlayButtonState(btn, id, true);
  };

  audio.onpause = ()=>{
    if(viewerAudio !== audio) return;
    if(shouldSuppressStop() && !userStopped){
      setTimeout(keepAudioPlaying, 50);
      return;
    }
    setPlayButtonState(btn, id, false);
  };

  audio.onended = ()=>{
    if(viewerAudio === audio) stopAudio(true);
  };

  document.querySelectorAll(".row.playing").forEach(r=>r.classList.remove("playing"));
  row.classList.add("playing");
  currentRow = row;
  currentBtn = btn;
}

// ===== 予約ロジック用 =====
const ROUND_START = "2026-06-27";
const ROUND_DAYS  = 40;
const FIRST_DAY_SEATS = [1,2,3,4,5,6,7,8,9];
const NORMAL_SEAT_COUNT = 5;
const SPECIAL_RESERVATION_DATES = ["2026-08-13","2026-09-12"];

// 表示範囲（必要なら延長）
const config = {
  validUntil: "2027-12-31"
};

function parseDateLocal(str){
  const [y,m,d] = str.split("-").map(Number);
  return new Date(y, m-1, d);
}
function formatDateLocal(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}
function addDays(date, days){
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}
function diffDays(a, b){
  const aa = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const bb = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.floor((bb - aa) / (24 * 60 * 60 * 1000));
}

function getRoundDay(dateStr){
  const start = parseDateLocal(ROUND_START);
  const date  = parseDateLocal(dateStr);
  const days  = diffDays(start, date);
  if(days < 0) return null;
  return (days % ROUND_DAYS) + 1;
}

function isTargetDate(dateStr){
  return getRoundDay(dateStr) !== null;
}

function isReservationDate(dateStr){
  return getRoundDay(dateStr) !== null;
}

function getStart(dateStr){
  const n = getRoundDay(dateStr);
  if(n === null || n === 1) return null;
  return (n - 2) * 5 + 1;
}

function getSeatList(dateStr){
  const n = getRoundDay(dateStr);
  if(n === null) return [];

  if(n === 1) return [...FIRST_DAY_SEATS];

  const start = getStart(dateStr);
  return Array.from({length:NORMAL_SEAT_COUNT}, (_,i)=>start+i);
}

function generateDates(){
  const result = [];
  const today = new Date();
  today.setHours(0,0,0,0);

  const end = parseDateLocal(config.validUntil);
  for(let d = parseDateLocal(ROUND_START); d <= end; d = addDays(d, 1)){
    d.setHours(0,0,0,0);
    if(d < today) continue;

    const ds = formatDateLocal(d);
    if(isTargetDate(ds)) result.push(ds);
  }
  return result;
}

const dates = generateDates();

function formatSeat(n){
  return String(n).padStart(3,"0");
}

async function editNormalSeat(date, seat, currentName){
  const d = parseDateLocal(date);
  const today = new Date();
  today.setHours(0,0,0,0);

  if(d < today){
    alert("過去の予約は変更できません");
    return;
  }

  const input = await askReservationName(currentName || "");
  if(input === null) return;

  const ref = db.ref(`reservations/${date}/${seat}`);
  const trimmed = input.trim();
  if(trimmed === ""){
    ref.remove();
  }else{
    rememberName(trimmed);
    ref.set(trimmed);
  }
}
function render(data){
  const app = document.getElementById("app");
  app.innerHTML = "";

  const today = new Date();
  today.setHours(0,0,0,0);

  dates.forEach(date => {
  
   // ===== 締め切り：当日06:00、締め切り2時間後(08:00)を過ぎたら非表示 =====
    const now = new Date();

    const deadline = parseDateLocal(date); // その日
    deadline.setHours(6, 0, 0, 0);         // 06:00

    const hideAfter = new Date(deadline.getTime() + 2 * 60 * 60 * 1000); // 08:00

    if(now > hideAfter){
      return; // この日付はタイトルも席も丸ごと表示しない
    }
    const roundDay = getRoundDay(date);
    if(roundDay === null) return;

    const d = parseDateLocal(date);
    d.setHours(0,0,0,0);

    const day = d.getDay();
    const isPast = d < today;
    const canReserve = isReservationDate(date);

    const title = document.createElement("div");
    title.className = "title";
    const isChallengeDay = roundDay !== 1 && (day === 0 || day === 1 || SPECIAL_RESERVATION_DATES.includes(date));
    const headingText = roundDay === 1
      ? "ラウンド初日 家庭盟誓訓読"
      : `ラウンド内${roundDay}日目${isChallengeDay ? " チャレンジデー" : ""}`;
    title.textContent = `■ ${date}（${["日","月","火","水","木","金","土"][day]}） / ${headingText}`;

    if(day===0){
      title.style.color = "red";
      title.style.background = "#ffeaea";
    }else{
      title.style.background = "#f0f0f0";
    }
    if(isPast) title.style.opacity = 0.5;

    app.appendChild(title);

    // ===== 1日目：縦並び（席番号＋名前表示＋予約/編集）=====
    if(roundDay === 1){
      FIRST_DAY_SEATS.forEach(seat => {
        const name = data?.[date]?.[seat] || "";

        const row = document.createElement("div");
        row.className = "row";
        row.classList.add(canReserve && name ? "filled-row" : canReserve ? "empty-row" : "readonly-row");
        if(isPast) row.style.opacity = 0.5;

        const top = document.createElement("div");
        top.className = "row-top";

        const num = document.createElement("div");
        num.className = "seat";
        num.textContent = seat;

        // 1日目は「再生・PDF・実ページ・シークバー」は出さない
        top.appendChild(num);

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = name || "空き";
        label.style.fontWeight = name ? "bold" : "";

        const edit = document.createElement("button");
        edit.className = `edit ${name ? "edit-existing" : "edit-reserve"}`;
        edit.textContent = name ? "編集" : "予約";

        edit.onclick = async () => {
          if(isPast){
            alert("過去の予約は変更できません");
            return;
          }

          const input = await askReservationName(name);
          if(input === null) return;

          const trimmed = input.trim();
          const ref = db.ref(`reservations/${date}/${seat}`);

          // 空欄＝削除（確認なし）
          if(trimmed === ""){
            ref.remove();
            return;
          }

          // 予約済みの上書き確認（不要ならこのifを削除OK）
          if(name){
            const ok = confirm(`この席は現在「${name}」で予約されています。\n上書きしますか？`);
            if(!ok) return;
          }

          rememberName(trimmed);
          ref.set(trimmed);
        };

        row.appendChild(top);
        row.appendChild(label);
        row.appendChild(edit);

        app.appendChild(row);
      });

      return; // 次の日付へ
    }

    // ===== 2日目以後：従来型UI =====
    const MAX_SEAT_NO = 192;
    const seatList = getSeatList(date).filter(seat => seat <= MAX_SEAT_NO);

    if(canReserve){
      // 残り席
      let used = 0;
      seatList.forEach(seat => {
        if(data?.[date]?.[seat]) used++;
      });
      const remain = seatList.length - used;

      const extraChallengeCount = seatList.length - remain;
      if(isChallengeDay || extraChallengeCount > 0){
        const remainDiv = document.createElement("div");
        remainDiv.className = "remain";
        remainDiv.innerHTML = isChallengeDay
          ? (remain===0
            ? `<span style="color:red;font-weight:bold;">満席</span>`
            : `残り <b>${remain}</b> 席`)
          : `<span style="color:#2563eb;font-weight:bold;">追加チャレンジ <b>${extraChallengeCount}</b></span>`;

        if(isPast) remainDiv.style.opacity = 0.5;
        app.appendChild(remainDiv);
      }
    }

    seatList.forEach(seat => {
      const id   = formatSeat(seat);
      const name = data?.[date]?.[seat] || "";

      const row = document.createElement("div");
      row.className = "row";
      row.classList.add(canReserve && name ? "filled-row" : canReserve ? "empty-row" : "readonly-row");
      if(isPast) row.style.opacity = 0.5;

      const top = document.createElement("div");
      top.className = "row-top";

      const num = document.createElement("div");
      num.className = "seat";
      num.textContent = seat;

      const seekWrap = document.createElement("div");
      seekWrap.className = "seekbar-wrap";
      seekWrap.innerHTML =
        `<div class="seekbar-time">` +
          `<span class="seek-cur">0:00</span>` +
          `<span class="seek-dur">0:00</span>` +
        `</div>` +
        `<input class="seekbar" type="range" min="0" max="100" step="0.1" value="0">`;

      const btn = document.createElement("button");
      btn.className = "play";
      btn.textContent = "▶";
      btn.title = "音声を再生";
      btn.setAttribute("aria-label", `音声 ${id} を再生`);
      btn.onclick = async () => {
        if(currentDocId === id && viewerAudio){
          if(viewerAudio.paused){
            userStopped = false;
            try{
              await viewerAudio.play();
              setPlayButtonState(btn, id, true);
            }catch{
              userStopped = true;
              setPlayButtonState(btn, id, false);
              alert("音声を再開できませんでした。もう一度お試しください。");
            }
          }else{
            userStopped = true;
            viewerAudio.pause();
            setPlayButtonState(btn, id, false);
          }
          return;
        }
        stopAudio(true);

        try{
          await loadAndPlayAudio(id, row, btn, seekWrap);
          currentDocId = id;
        }catch{
          stopAudio(true);
        }
      };

      const pdfBtn = document.createElement("button");
      pdfBtn.className = "play";
      pdfBtn.textContent = "文章";
      pdfBtn.title = "PDFを開く";
      pdfBtn.onclick = () => {
        if(currentDocId && currentDocId !== id) stopAudio(true);
        suppressStopForPdf = true;

        const url = `docs/${id}.pdf`;

        openPdfForDevice(url, `文章 ${id}`);
      };

      const doc2Btn = document.createElement("button");
      doc2Btn.className = "play";
      doc2Btn.textContent = "実ページ";
      doc2Btn.title = "実ページを開く";
      doc2Btn.style.fontSize = "11px";
      doc2Btn.onclick = () => {
        if(currentDocId && currentDocId !== id) stopAudio(true);
        suppressStopForPdf = true;

        const url = `docs2/${id}.pdf`;

        openPdfForDevice(url, `実ページ ${id}`);
      };

      top.appendChild(num);
      top.appendChild(btn);
      top.appendChild(pdfBtn);
      top.appendChild(doc2Btn);

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = name || (isChallengeDay ? "空き" : "レギュラー");
      label.style.fontWeight = name ? "bold" : "";

      const edit = document.createElement("button");
      edit.className = `edit ${name ? "edit-existing" : "edit-reserve"}`;
      edit.textContent = name ? "編集" : "予約";
      edit.onclick = () => editNormalSeat(date, seat, name);

      row.appendChild(top);
      if(canReserve){
        row.appendChild(label);
        row.appendChild(edit);
      }
      row.appendChild(seekWrap);

      app.appendChild(row);
    });
  });
}

db.ref("reservations").on("value", snap=>{
  render(snap.val() || {});
});
</script>

</body>
